name: Multi-OS Packaging and Release (Gitea)

on:
  push:
    tags:
      - 'v*'
      - 'release-*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.base_image }}
    if: >-
      (startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr') ||
      gitea.event_name == 'workflow_dispatch') &&
      (gitea.event_name == 'workflow_dispatch' ||
      startsWith(gitea.ref, 'refs/tags/') ||
      contains(gitea.event.head_commit.message, 'RUN_WORKFLOW') ||
      contains(gitea.event.commits[0].message, 'RUN_WORKFLOW') ||
      contains(gitea.event.pull_request.title, 'RUN_WORKFLOW') ||
      contains(gitea.event.head_commit.message, 'RELEASE_ARTIFACTS') ||
      contains(gitea.event.commits[0].message, 'RELEASE_ARTIFACTS'))
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: debian-12
            pkg_type: deb
            base_image: docker.io/library/debian:bookworm
          - os: debian-13
            pkg_type: deb
            base_image: docker.io/library/debian:trixie
          - os: fedora
            pkg_type: rpm
            base_image: docker.io/library/fedora:latest
          - os: archlinux
            pkg_type: arch
            base_image: docker.io/library/archlinux:latest

    steps:
      - name: "Diagnostic: Environment & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          echo "=== Host / Container OS ==="
          cat /etc/os-release 2>/dev/null || true
          uname -a
          id
          pwd
          nproc || true
          free -h || true
          df -h . || true
          echo "=== Runner Context ==="
          printf '%s\n' "$CTX_RUNNER"
          echo "=== Strategy / Matrix Context ==="
          printf '%s\n' "$CTX_STRATEGY"
          printf '%s\n' "$CTX_MATRIX"
          echo "=== Gitea Context (token redacted) ==="
          printf '%s\n' "$CTX_GITEA" | sed 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'

      - name: Install Node.js and Git Prerequisites (Debian)
        if: matrix.os == 'debian-12' || matrix.os == 'debian-13'
        run: |
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          apt-get "${APT_OPTS[@]}" -o APT::Update::Error-Mode=any update || apt-get "${APT_OPTS[@]}" update || true
          apt-get "${APT_OPTS[@]}" install -y --no-install-recommends nodejs git ca-certificates

      - name: Install Node.js and Git Prerequisites (Arch Linux)
        if: matrix.os == 'archlinux'
        run: pacman -Syu --noconfirm nodejs git ca-certificates python

      - name: Install Node.js and Git Prerequisites (Fedora)
        if: matrix.os == 'fedora'
        run: dnf install -y nodejs git ca-certificates

      - name: Install Build Dependencies (Debian)
        if: matrix.os == 'debian-12' || matrix.os == 'debian-13'
        run: |
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          apt-get "${APT_OPTS[@]}" -o APT::Update::Error-Mode=any update || apt-get "${APT_OPTS[@]}" update || true
          apt-get "${APT_OPTS[@]}" install -y --no-install-recommends curl wget gnupg sudo \
                             build-essential ccache cmake g++ make pkg-config python3 file linux-headers-amd64 \
                             libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
                             libgmp-dev libssl-dev libsasl2-dev uuid-dev binutils-dev libbfd-dev zlib1g-dev libiberty-dev libzstd-dev \
                             maven dpkg-dev python3-pip python3-venv plantuml fonts-noto-color-emoji libpango-1.0-0
          . /etc/os-release
          mkdir -p /etc/apt/keyrings
          wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | tee /etc/apt/keyrings/adoptium.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb ${VERSION_CODENAME:-bookworm} main" | tee /etc/apt/sources.list.d/adoptium.list
          apt-get "${APT_OPTS[@]}" -o APT::Update::Error-Mode=any update || apt-get "${APT_OPTS[@]}" update || true
          apt-get "${APT_OPTS[@]}" install -y --no-install-recommends temurin-21-jdk || apt-get "${APT_OPTS[@]}" install -y --no-install-recommends openjdk-21-jdk

      - name: Install Build Dependencies (Fedora)
        if: matrix.os == 'fedora'
        run: |
          dnf install -y curl sudo ccache gcc-c++ make cmake pkgconf-pkg-config python3 file \
                         alsa-lib-devel libX11-devel libXrandr-devel libXi-devel \
                         mesa-libGL-devel mesa-libGLU-devel libXcursor-devel libXinerama-devel \
                         gmp-devel openssl-devel libuuid-devel zlib-devel binutils-devel libzstd-devel \
                         java-latest-openjdk-devel maven rpm-build python3-pip plantuml google-noto-color-emoji-fonts pango cairo

      - name: Install Build Dependencies (Arch Linux)
        if: matrix.os == 'archlinux'
        run: |
          pacman -S --needed --noconfirm \
                         curl sudo base-devel ccache cmake python file \
                         alsa-lib libx11 libxrandr libxi mesa glu libxcursor libxinerama \
                         gmp openssl util-linux-libs zlib binutils jdk21-openjdk maven npm python-pip plantuml noto-fonts-emoji pango cairo \
                         cantarell-fonts gnu-free-fonts zstd
          archlinux-java set java-21-openjdk || true

      - name: Checkout Nunki
        uses: actions/checkout@v4
        with:
          path: nunki

      - name: Checkout Quasar
        shell: bash
        env:
          GITEA_SERVER: ${{ gitea.server_url }}
          GITEA_CLONE_TOKEN: ${{ secrets.QUASAR_READ_TOKEN || secrets.GITEA_CLEANUP_TOKEN || gitea.token }}
        run: |
          set -euo pipefail
          rm -rf quasar
          ASKPASS_SCRIPT="$(mktemp)"
          trap 'rm -f "${ASKPASS_SCRIPT}"' EXIT
          cat > "${ASKPASS_SCRIPT}" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "${GITEA_CLONE_TOKEN}" ;;
          esac
          EOF
          chmod 700 "${ASKPASS_SCRIPT}"
          CLONED=false
          if [ -n "${GITEA_CLONE_TOKEN:-}" ]; then
            echo "Attempting shallow clone from ${GITEA_SERVER}/m/quasar.git..."
            if GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="${ASKPASS_SCRIPT}" \
              git -c http.sslVerify=false clone --depth=1 --recursive \
              "${GITEA_SERVER}/m/quasar.git" quasar; then
              CLONED=true
            else
              echo "Gitea clone unavailable; falling back to public GitHub mirror."
              rm -rf quasar
            fi
          fi
          if [ "${CLONED}" != "true" ]; then
            git clone --depth=1 --recursive https://github.com/mlecabellec/quasar.git quasar
          fi
          git -C quasar log -1 --oneline

      - name: "Diagnostic: Workspace & Toolchain Check"
        run: |
          echo "=== Workspace Files ==="
          ls -la
          if [ -d .git ]; then
            git status -sb || true
            git remote -v || true
            git log -1 --oneline || true
          fi
          echo "=== Available Tools ==="
          for cmd in node git python3 cmake gcc g++ make java mvn podman docker curl; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf "%-10s %s\n" "$cmd:" "$(command -v "$cmd")"
            else
              printf "%-10s missing\n" "$cmd:"
            fi
          done

      - name: Build Nunki
        run: |
          cd nunki
          mvn clean package -DskipTests
          ./helpers/package.sh ${{ matrix.pkg_type }} ../dist-packages

      - name: Restore Quasar ccache
        id: quasar-ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: quasar/.ccache
          key: ${{ matrix.os }}-quasar-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}
          restore-keys: |
            ${{ matrix.os }}-quasar-ccache-${{ gitea.sha }}-
            ${{ matrix.os }}-quasar-ccache-

      - name: Build and Package Quasar
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/quasar/.ccache
        run: |
          cd quasar
          mkdir -p .ccache build-projects
          ccache -z || true
          cmake -S cmake-projects -B build-projects \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG" \
            -DCMAKE_C_FLAGS_RELEASE="-O1 -DNDEBUG" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_POLICY_DEFAULT_CMP0000=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SHARED_LINKER_FLAGS="-lzstd" \
            -DCMAKE_EXE_LINKER_FLAGS="-lzstd"
          CPUS=$(nproc 2>/dev/null || echo 2)
          PROC_AVAIL_KB=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)
          CGROUP_AVAIL_KB=$PROC_AVAIL_KB
          if [ -r /sys/fs/cgroup/memory.max ]; then
            CG_MAX=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo max)
            CG_CUR=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo 0)
            if [ "$CG_MAX" != "max" ] && [ "$CG_MAX" -gt 0 ] 2>/dev/null; then
              CGROUP_AVAIL_KB=$(( (CG_MAX - CG_CUR) / 1024 ))
            fi
          elif [ -r /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
            CG_MAX=$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo 0)
            CG_CUR=$(cat /sys/fs/cgroup/memory/memory.usage_in_bytes 2>/dev/null || echo 0)
            if [ "$CG_MAX" -gt 0 ] 2>/dev/null && [ "$CG_MAX" -lt 9000000000000000 ] 2>/dev/null; then
              CGROUP_AVAIL_KB=$(( (CG_MAX - CG_CUR) / 1024 ))
            fi
          fi
          MEM_AVAIL_KB=$(( PROC_AVAIL_KB < CGROUP_AVAIL_KB ? PROC_AVAIL_KB : CGROUP_AVAIL_KB ))
          if [ "$MEM_AVAIL_KB" -lt 0 ]; then MEM_AVAIL_KB=0; fi
          # Cap BUILD_JOBS=1 whenever effective RAM is <=10 GiB (handles 8 GiB runner cgroup limits)
          if [ "$MEM_AVAIL_KB" -le 10485760 ]; then
            BUILD_JOBS=1
          else
            MEM_JOBS=$(( MEM_AVAIL_KB / 4194304 ))
            if [ "$MEM_JOBS" -lt 1 ]; then MEM_JOBS=1; fi
            BUILD_JOBS=$(( CPUS < MEM_JOBS ? CPUS : MEM_JOBS ))
            if [ "$BUILD_JOBS" -gt 2 ]; then BUILD_JOBS=2; fi
          fi
          echo "Quasar build parallelism: BUILD_JOBS=$BUILD_JOBS (nproc=$CPUS, procAvail=${PROC_AVAIL_KB}kB, effAvail=${MEM_AVAIL_KB}kB)"
          free -h || true
          cmake --build build-projects --target liblua quasar_coretypes quasar_named utils --parallel "$BUILD_JOBS" --verbose
          # Build sol2-heavy quasar_scripting sequentially so RegistryBindings.cpp has full RAM headroom
          cmake --build build-projects --target quasar_scripting --parallel 1 --verbose
          cmake --build build-projects --parallel "$BUILD_JOBS" --verbose
          free -h || true
          ccache -s || true
          ../nunki/helpers/package-quasar.sh ${{ matrix.pkg_type }} ../dist-packages

      - name: Generate Distro Containerfiles
        run: |
          mkdir -p distro-dockerfiles
          if [ "${{ matrix.pkg_type }}" = "deb" ]; then
            printf 'FROM %s\nRUN apt-get update && apt-get install -y openjdk-21-jre-headless && rm -rf /var/lib/apt/lists/*\nCOPY nunki_*.deb /tmp/\nRUN dpkg -i /tmp/nunki_*.deb || apt-get install -f -y\nEXPOSE 8080\nENTRYPOINT ["/usr/bin/nunki"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.nunki
            printf 'FROM %s\nRUN apt-get update && apt-get install -y libssl3 libuuid1 zlib1g && rm -rf /var/lib/apt/lists/*\nCOPY quasar_*.deb /tmp/\nRUN dpkg -i /tmp/quasar_*.deb || apt-get install -f -y\nEXPOSE 4840\nENTRYPOINT ["/usr/bin/quasar_server"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.quasar
          elif [ "${{ matrix.pkg_type }}" = "rpm" ]; then
            printf 'FROM %s\nRUN dnf install -y java-latest-openjdk-headless && dnf clean all\nCOPY nunki-*.rpm /tmp/\nRUN dnf localinstall -y /tmp/nunki-*.rpm\nEXPOSE 8080\nENTRYPOINT ["/usr/bin/nunki"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.nunki
            printf 'FROM %s\nRUN dnf install -y openssl zlib libuuid && dnf clean all\nCOPY quasar-*.rpm /tmp/\nRUN dnf localinstall -y /tmp/quasar-*.rpm\nEXPOSE 4840\nENTRYPOINT ["/usr/bin/quasar_server"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.quasar
          elif [ "${{ matrix.pkg_type }}" = "arch" ]; then
            printf 'FROM %s\nCOPY nunki-*.pkg.tar.zst /tmp/\nRUN pacman -Syu --noconfirm && pacman -U --noconfirm /tmp/nunki-*.pkg.tar.zst && pacman -Scc --noconfirm\nEXPOSE 8080\nENTRYPOINT ["/usr/bin/nunki"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.nunki
            printf 'FROM %s\nCOPY quasar-*.pkg.tar.zst /tmp/\nRUN pacman -Syu --noconfirm && pacman -U --noconfirm /tmp/quasar-*.pkg.tar.zst && pacman -Scc --noconfirm\nEXPOSE 4840\nENTRYPOINT ["/usr/bin/quasar_server"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.quasar
          fi
          cp distro-dockerfiles/Dockerfile.nunki dist-packages/
          cp distro-dockerfiles/Dockerfile.quasar dist-packages/

      - name: Checkout MkDocs Kit
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_CLONE_TOKEN: ${{ secrets.MKDOCS_KIT_TOKEN || secrets.GITEA_CLEANUP_TOKEN || gitea.token }}
        run: |
          rm -rf mkdocs-kit
          GITEA_BASE="${GITEA_SERVER_URL%/}"
          GITEA_BASE="${GITEA_BASE:-https://gitea2.lecabellec.fr}"
          CLONE_OK=0
          if [ -n "${GITEA_CLONE_TOKEN:-}" ]; then
            ASKPASS_SCRIPT=$(mktemp)
            printf '#!/bin/sh\ncase "$1" in\n  *Username*) printf "%%s\\n" "x-access-token" ;;\n  *) printf "%%s\\n" "${GITEA_CLONE_TOKEN}" ;;\nesac\n' > "$ASKPASS_SCRIPT"
            chmod +x "$ASKPASS_SCRIPT"
            if GIT_ASKPASS="$ASKPASS_SCRIPT" GIT_TERMINAL_PROMPT=0 git clone --depth=1 "${GITEA_BASE}/m/mkdocs-kit.git" mkdocs-kit; then
              CLONE_OK=1
            fi
            rm -f "$ASKPASS_SCRIPT"
          fi
          if [ "$CLONE_OK" -eq 0 ]; then
            GIT_TERMINAL_PROMPT=0 git clone --depth=1 "${GITEA_BASE}/m/mkdocs-kit.git" mkdocs-kit || \
              git clone --depth=1 https://github.com/mlecabellec/mkdocs-kit.git mkdocs-kit
          fi

      - name: Install Python dependencies for documentation
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install --upgrade pip
          .venv-docs/bin/pip install "setuptools<82.0.0"
          .venv-docs/bin/pip install ./mkdocs-kit

      - name: Build Nunki Documentation
        continue-on-error: true
        run: ${{ gitea.workspace }}/.venv-docs/bin/mkdocs-kit build
        working-directory: nunki/doc

      - name: Build Quasar Documentation
        continue-on-error: true
        run: ${{ gitea.workspace }}/.venv-docs/bin/mkdocs-kit build
        working-directory: quasar/doc

      - name: Copy Documentation to dist-packages
        run: |
          mkdir -p dist-packages/docs-nunki dist-packages/docs-quasar
          cp nunki/doc/documentation.pdf dist-packages/nunki-documentation.pdf || true
          cp -r nunki/doc/site dist-packages/docs-nunki/site || true
          cp quasar/doc/documentation.pdf dist-packages/quasar-documentation.pdf || true
          cp -r quasar/doc/site dist-packages/docs-quasar/site || true

      - name: Upload Linux Packages & Containerfiles
        uses: https://gitea.com/actions/gitea-upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist-packages/*
          retention-days: 7

      - name: Save Quasar ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: quasar/.ccache
          key: ${{ matrix.os }}-quasar-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}

      - name: "Release: Publish Artifacts to Gitea Tag Release"
        if: success() && startsWith(gitea.ref, 'refs/tags/')
        continue-on-error: true
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_RELEASE_TOKEN || secrets.GITEA_CLEANUP_TOKEN || gitea.token }}
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPO: ${{ gitea.repository }}
          TAG_NAME: ${{ gitea.ref_name }}
          RELEASE_PATHS: |
            dist-packages/*
        run: |
          if [ -z "${GITEA_TOKEN:-}" ] || ! command -v python3 >/dev/null 2>&1; then
            echo "Release skipped: missing GITEA_TOKEN or python3."
            exit 0
          fi
          python3 - <<'PY'
          import glob, json, mimetypes, os, urllib.error, urllib.parse, urllib.request, uuid

          token = os.environ.get("GITEA_TOKEN", "").strip()
          api = os.environ.get("GITEA_API_URL", "").rstrip("/")
          repo = os.environ.get("GITEA_REPO", "").strip("/")
          tag = os.environ.get("TAG_NAME", "").strip()
          raw_paths = os.environ.get("RELEASE_PATHS", "")
          if not (token and api and repo and tag):
              print("Release skipped: missing API context or tag.")
              raise SystemExit(0)

          files = []
          seen = set()
          for pat in raw_paths.splitlines():
              pat = pat.strip()
              if not pat:
                  continue
              for match in sorted(glob.glob(pat)):
                  if os.path.isfile(match) and match not in seen:
                      seen.add(match)
                      files.append(match)

          if not files:
              print(f"Release skipped for tag {tag}: no matching artifact files found.")
              raise SystemExit(0)

          def api_json(method, path, payload=None):
              url = f"{api}/repos/{repo}{path}"
              headers = {"Authorization": f"token {token}"}
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      return resp.status, (json.loads(body) if body.strip() else {})
              except urllib.error.HTTPError as exc:
                  err = exc.read().decode("utf-8", errors="replace")
                  return exc.code, {"error": err[:300]}
              except Exception as exc:
                  return 0, {"error": str(exc)}

          def upload_asset(rel_id, fpath):
              fname = os.path.basename(fpath)
              qname = urllib.parse.quote(fname)
              url = f"{api}/repos/{repo}/releases/{rel_id}/assets?name={qname}"
              boundary = f"----GiteaRel{uuid.uuid4().hex}"
              ctype = mimetypes.guess_type(fname)[0] or "application/octet-stream"
              with open(fpath, "rb") as fh:
                  content = fh.read()
              body = (
                  f"--{boundary}\r\n"
                  f'Content-Disposition: form-data; name="attachment"; filename="{fname}"\r\n'
                  f"Content-Type: {ctype}\r\n\r\n"
              ).encode("utf-8") + content + f"\r\n--{boundary}--\r\n".encode("utf-8")
              headers = {
                  "Authorization": f"token {token}",
                  "Content-Type": f"multipart/form-data; boundary={boundary}",
              }
              req = urllib.request.Request(url, data=body, method="POST", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      return resp.status, resp.read().decode("utf-8", errors="replace")[:200]
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", errors="replace")[:200]
              except Exception as exc:
                  return 0, str(exc)

          qtag = urllib.parse.quote(tag, safe="")
          st, rel = api_json("GET", f"/releases/tags/{qtag}")
          if st == 404:
              st, rel = api_json(
                  "POST",
                  "/releases",
                  {
                      "tag_name": tag,
                      "name": tag,
                      "body": f"Automated release artifacts published by Gitea Actions for tag `{tag}`.",
                      "draft": False,
                      "prerelease": ("-" in tag),
                  },
              )
          if st not in (200, 201) or not isinstance(rel, dict) or not rel.get("id"):
              print(f"Release creation/lookup failed for {tag} -> HTTP {st}: {rel}")
              if st == 403:
                  print("Hint: set GITEA_RELEASE_TOKEN secret if token lacks release write scope")
              raise SystemExit(0)

          rel_id = rel["id"]
          st_a, assets = api_json("GET", f"/releases/{rel_id}/assets")
          existing = {}
          if st_a == 200 and isinstance(assets, list):
              for a in assets:
                  if isinstance(a, dict) and a.get("name") and a.get("id"):
                      existing[a["name"]] = a["id"]

          for fpath in files:
              fname = os.path.basename(fpath)
              if fname in existing:
                  da, _ = api_json("DELETE", f"/releases/{rel_id}/assets/{existing[fname]}")
                  print(f"[release {tag}] Replaced existing asset {fname} -> HTTP {da}")
              su, msg = upload_asset(rel_id, fpath)
              fsize = os.path.getsize(fpath)
              print(f"[release {tag}] Uploaded {fname} ({fsize} bytes) -> HTTP {su}")
              if su not in (200, 201):
                  print(f"  detail: {msg}")
          PY

      - name: "Retention: Prune Older Workflow Runs, Logs & Artifacts (Keep Last 3, Max 7 Days)"
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_CLEANUP_TOKEN || gitea.token }}
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPO: ${{ gitea.repository }}
          GITEA_RUN_ID: ${{ gitea.run_id }}
          KEEP_RUNS: "3"
          RETENTION_DAYS: "7"
        run: |
          if [ -z "${GITEA_TOKEN:-}" ] || ! command -v python3 >/dev/null 2>&1; then
            echo "Retention skipped: missing GITEA_TOKEN or python3."
            exit 0
          fi
          python3 - <<'PY'
          import collections, datetime, json, os, re, urllib.error, urllib.request

          token = os.environ.get("GITEA_TOKEN", "").strip()
          api = os.environ.get("GITEA_API_URL", "").rstrip("/")
          repo = os.environ.get("GITEA_REPO", "").strip("/")
          cur_id = str(os.environ.get("GITEA_RUN_ID", "")).strip()
          keep = int(os.environ.get("KEEP_RUNS", "3"))
          retention_days = int(os.environ.get("RETENTION_DAYS", "7"))
          if not (token and api and repo):
              print("Retention skipped: missing API context.")
              raise SystemExit(0)

          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(
              days=retention_days
          )

          def parse_ts(val):
              if not val or not isinstance(val, str):
                  return None
              s = val.strip()
              if s.endswith("Z"):
                  s = s[:-1] + "+00:00"
              s = re.sub(r"(\.\d{6})\d+", r"\1", s)
              try:
                  dt = datetime.datetime.fromisoformat(s)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=datetime.timezone.utc)
                  return dt.astimezone(datetime.timezone.utc)
              except Exception:
                  return None

          def is_expired(obj):
              for key in ("created_at", "started_at", "updated_at", "completed_at"):
                  dt = parse_ts(obj.get(key))
                  if dt is not None:
                      return dt < cutoff
              return False

          def req(method, path):
              url = f"{api}/repos/{repo}{path}"
              r = urllib.request.Request(
                  url, method=method, headers={"Authorization": f"token {token}"}
              )
              try:
                  with urllib.request.urlopen(r, timeout=15) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      return resp.status, (json.loads(body) if body.strip() else {})
              except urllib.error.HTTPError as exc:
                  err = exc.read().decode("utf-8", errors="replace")
                  return exc.code, {"error": err[:200]}
              except Exception as exc:
                  return 0, {"error": str(exc)}

          all_runs = []
          for page in range(1, 21):
              st, data = req("GET", f"/actions/runs?page={page}&limit=50")
              if st != 200:
                  print(f"GET runs page={page} -> HTTP {st}: {data}")
                  break
              batch = (data.get("workflow_runs") or []) if isinstance(data, dict) else []
              if not batch:
                  break
              all_runs.extend(batch)
              if len(batch) < 50:
                  break

          by_wf = collections.defaultdict(list)
          for run in all_runs:
              wf = (run.get("path") or "__unknown__").split("@", 1)[0]
              by_wf[wf].append(run)

          active_states = {"in_progress", "running", "queued", "waiting", "pending"}
          pruned_ids = set()
          for wf, runs in sorted(by_wf.items()):
              runs.sort(key=lambda r: int(r.get("id") or 0), reverse=True)
              for idx, run in enumerate(runs):
                  if idx < keep and not is_expired(run):
                      continue
                  rid = str(run.get("id") or "")
                  status = str(run.get("status") or "").lower()
                  if not rid or rid == cur_id or status in active_states:
                      continue
                  pruned_ids.add(rid)
                  st_a, arts = req("GET", f"/actions/runs/{rid}/artifacts")
                  if st_a == 200 and isinstance(arts, dict):
                      for art in (arts.get("artifacts") or []):
                          aid = art.get("id")
                          if aid is not None:
                              da, _ = req("DELETE", f"/actions/artifacts/{aid}")
                              print(f"[{wf}] DEL artifact id={aid} -> HTTP {da}")
                  dr, _ = req("DELETE", f"/actions/runs/{rid}")
                  print(f"[{wf}] DEL run id={rid} (logs+run) -> HTTP {dr}")
                  if dr == 403:
                      print("Hint: set GITEA_CLEANUP_TOKEN secret if token lacks delete")

          st_all, repo_arts = req("GET", "/actions/artifacts?limit=100")
          if st_all == 200 and isinstance(repo_arts, dict):
              for art in (repo_arts.get("artifacts") or []):
                  wrid = str((art.get("workflow_run") or {}).get("id") or "")
                  if wrid in pruned_ids or art.get("expired") or is_expired(art):
                      aid = art.get("id")
                      if aid is not None:
                          da, _ = req("DELETE", f"/actions/artifacts/{aid}")
                          print(f"[orphan/expired] DEL artifact {aid} -> HTTP {da}")
          print(
              f"Retention check finished (keep={keep}, "
              f"retention_days={retention_days}, runs_scanned={len(all_runs)})"
          )
          PY

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          free -h || true
          df -h . || true
          du -sh quasar/.ccache quasar/build-projects dist-packages 2>/dev/null || true
          ls -la
