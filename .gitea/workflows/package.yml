name: Multi-OS Packaging and Release (Gitea)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: debian-12
            pkg_type: deb
            base_image: docker.io/library/debian:bookworm
          - os: debian-13
            pkg_type: deb
            base_image: docker.io/library/debian:trixie
          - os: fedora
            pkg_type: rpm
            base_image: docker.io/library/fedora:latest
          - os: archlinux
            pkg_type: arch
            base_image: docker.io/library/archlinux:latest

    steps:
      - name: "Diagnostic: Environment & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          echo "=== Host / Container OS ==="
          cat /etc/os-release 2>/dev/null || true
          uname -a
          id
          pwd
          nproc || true
          free -h || true
          df -h . || true
          echo "=== Runner Context ==="
          printf '%s\n' "$CTX_RUNNER"
          echo "=== Strategy / Matrix Context ==="
          printf '%s\n' "$CTX_STRATEGY"
          printf '%s\n' "$CTX_MATRIX"
          echo "=== Gitea Context (token redacted) ==="
          printf '%s\n' "$CTX_GITEA" | sed 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'

      - name: Install Node.js and Git Prerequisites (Debian)
        if: matrix.os == 'debian-12' || matrix.os == 'debian-13'
        run: apt-get update && apt-get install -y --no-install-recommends nodejs git ca-certificates

      - name: Install Node.js and Git Prerequisites (Arch Linux)
        if: matrix.os == 'archlinux'
        run: pacman -Sy --noconfirm nodejs git ca-certificates

      - name: Install Node.js and Git Prerequisites (Fedora)
        if: matrix.os == 'fedora'
        run: dnf install -y nodejs git ca-certificates

      - name: Install Build Dependencies (Debian)
        if: matrix.os == 'debian-12' || matrix.os == 'debian-13'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl wget gnupg sudo \
                             build-essential ccache cmake g++ make pkg-config python3 file linux-headers-amd64 \
                             libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
                             libgmp-dev libssl-dev libsasl2-dev uuid-dev binutils-dev libbfd-dev zlib1g-dev libiberty-dev libzstd-dev \
                             maven dpkg-dev python3-pip python3-venv plantuml libpango-1.0-0
          . /etc/os-release
          mkdir -p /etc/apt/keyrings
          wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | tee /etc/apt/keyrings/adoptium.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb ${VERSION_CODENAME:-bookworm} main" | tee /etc/apt/sources.list.d/adoptium.list
          apt-get update && apt-get install -y --no-install-recommends temurin-21-jdk || apt-get install -y --no-install-recommends openjdk-21-jdk

      - name: Install Build Dependencies (Fedora)
        if: matrix.os == 'fedora'
        run: |
          dnf install -y curl sudo ccache gcc-c++ make cmake pkgconf-pkg-config python3 file \
                         alsa-lib-devel libX11-devel libXrandr-devel libXi-devel \
                         mesa-libGL-devel mesa-libGLU-devel libXcursor-devel libXinerama-devel \
                         gmp-devel openssl-devel libuuid-devel zlib-devel binutils-devel libzstd-devel \
                         java-21-openjdk-devel maven rpm-build python3-pip plantuml pango cairo

      - name: Install Build Dependencies (Arch Linux)
        if: matrix.os == 'archlinux'
        run: |
          pacman -S --needed --noconfirm \
                         curl sudo base-devel ccache cmake python file \
                         alsa-lib libx11 libxrandr libxi mesa glu libxcursor libxinerama \
                         gmp openssl util-linux-libs zlib binutils jdk21-openjdk maven npm python-pip plantuml pango cairo \
                         cantarell-fonts gnu-free-fonts zstd
          archlinux-java set java-21-openjdk || true

      - name: Checkout Nunki
        uses: actions/checkout@v4
        with:
          path: nunki

      - name: Checkout Quasar
        uses: actions/checkout@v4
        with:
          repository: m/quasar
          path: quasar
          submodules: recursive
          token: ${{ gitea.token }}

      - name: "Diagnostic: Workspace & Toolchain Check"
        run: |
          echo "=== Workspace Files ==="
          ls -la
          if [ -d .git ]; then
            git status -sb || true
            git remote -v || true
            git log -1 --oneline || true
          fi
          echo "=== Available Tools ==="
          for cmd in node git python3 cmake gcc g++ make java mvn podman docker curl; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf "%-10s %s\n" "$cmd:" "$(command -v "$cmd")"
            else
              printf "%-10s missing\n" "$cmd:"
            fi
          done

      - name: Build Nunki
        run: |
          cd nunki
          mvn clean package -DskipTests
          ./helpers/package.sh ${{ matrix.pkg_type }} ../dist-packages

      - name: Restore Quasar ccache
        id: quasar-ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: quasar/.ccache
          key: ${{ matrix.os }}-quasar-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}
          restore-keys: |
            ${{ matrix.os }}-quasar-ccache-${{ gitea.sha }}-
            ${{ matrix.os }}-quasar-ccache-

      - name: Build and Package Quasar
        env:
          CCACHE_DIR: ${{ gitea.workspace }}/quasar/.ccache
        run: |
          cd quasar
          mkdir -p .ccache build-projects
          ccache -z || true
          cmake -S cmake-projects -B build-projects \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_POLICY_DEFAULT_CMP0000=NEW \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SHARED_LINKER_FLAGS="-lzstd" \
            -DCMAKE_EXE_LINKER_FLAGS="-lzstd"
          CPUS=$(nproc 2>/dev/null || echo 2)
          MEM_AVAIL_KB=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || echo 0)
          # Reserve ~4 GiB per concurrent C++23 -O3 compilation slot (0B swap on runner), capped at 2
          MEM_JOBS=$(( MEM_AVAIL_KB / 4194304 ))
          if [ "$MEM_JOBS" -lt 1 ]; then MEM_JOBS=1; fi
          BUILD_JOBS=$(( CPUS < MEM_JOBS ? CPUS : MEM_JOBS ))
          if [ "$BUILD_JOBS" -gt 2 ]; then BUILD_JOBS=2; fi
          echo "Quasar build parallelism: BUILD_JOBS=$BUILD_JOBS (nproc=$CPUS, MemAvailable=${MEM_AVAIL_KB}kB)"
          free -h || true
          cmake --build build-projects --target liblua quasar_coretypes quasar_named utils --parallel "$BUILD_JOBS" --verbose
          # Build sol2-heavy quasar_scripting sequentially so RegistryBindings.cpp has full RAM headroom
          cmake --build build-projects --target quasar_scripting --parallel 1 --verbose
          cmake --build build-projects --parallel "$BUILD_JOBS" --verbose
          free -h || true
          ccache -s || true
          ../nunki/helpers/package-quasar.sh ${{ matrix.pkg_type }} ../dist-packages

      - name: Generate Distro Containerfiles
        run: |
          mkdir -p distro-dockerfiles
          if [ "${{ matrix.pkg_type }}" = "deb" ]; then
            printf 'FROM %s\nRUN apt-get update && apt-get install -y openjdk-21-jre-headless && rm -rf /var/lib/apt/lists/*\nCOPY nunki_*.deb /tmp/\nRUN dpkg -i /tmp/nunki_*.deb || apt-get install -f -y\nEXPOSE 8080\nENTRYPOINT ["/usr/bin/nunki"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.nunki
            printf 'FROM %s\nRUN apt-get update && apt-get install -y libssl3 libuuid1 zlib1g && rm -rf /var/lib/apt/lists/*\nCOPY quasar_*.deb /tmp/\nRUN dpkg -i /tmp/quasar_*.deb || apt-get install -f -y\nEXPOSE 4840\nENTRYPOINT ["/usr/bin/quasar_server"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.quasar
          elif [ "${{ matrix.pkg_type }}" = "rpm" ]; then
            printf 'FROM %s\nRUN dnf install -y java-21-openjdk-headless && dnf clean all\nCOPY nunki-*.rpm /tmp/\nRUN dnf localinstall -y /tmp/nunki-*.rpm\nEXPOSE 8080\nENTRYPOINT ["/usr/bin/nunki"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.nunki
            printf 'FROM %s\nRUN dnf install -y openssl zlib libuuid && dnf clean all\nCOPY quasar-*.rpm /tmp/\nRUN dnf localinstall -y /tmp/quasar-*.rpm\nEXPOSE 4840\nENTRYPOINT ["/usr/bin/quasar_server"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.quasar
          elif [ "${{ matrix.pkg_type }}" = "arch" ]; then
            printf 'FROM %s\nCOPY nunki-*.pkg.tar.zst /tmp/\nRUN pacman -Syu --noconfirm && pacman -U --noconfirm /tmp/nunki-*.pkg.tar.zst && pacman -Scc --noconfirm\nEXPOSE 8080\nENTRYPOINT ["/usr/bin/nunki"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.nunki
            printf 'FROM %s\nCOPY quasar-*.pkg.tar.zst /tmp/\nRUN pacman -Syu --noconfirm && pacman -U --noconfirm /tmp/quasar-*.pkg.tar.zst && pacman -Scc --noconfirm\nEXPOSE 4840\nENTRYPOINT ["/usr/bin/quasar_server"]\n' "${{ matrix.base_image }}" > distro-dockerfiles/Dockerfile.quasar
          fi
          cp distro-dockerfiles/Dockerfile.nunki dist-packages/
          cp distro-dockerfiles/Dockerfile.quasar dist-packages/

      - name: Checkout MkDocs Kit
        run: |
          rm -rf mkdocs-kit
          git clone --depth=1 https://github.com/mlecabellec/mkdocs-kit.git mkdocs-kit

      - name: Install Python dependencies for documentation
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install --upgrade pip
          .venv-docs/bin/pip install "setuptools<82.0.0"
          .venv-docs/bin/pip install ./mkdocs-kit

      - name: Build Nunki Documentation
        continue-on-error: true
        run: ${{ gitea.workspace }}/.venv-docs/bin/mkdocs-kit build
        working-directory: nunki/doc

      - name: Build Quasar Documentation
        continue-on-error: true
        run: ${{ gitea.workspace }}/.venv-docs/bin/mkdocs-kit build
        working-directory: quasar/doc

      - name: Copy Documentation to dist-packages
        run: |
          mkdir -p dist-packages/docs-nunki dist-packages/docs-quasar
          cp nunki/doc/documentation.pdf dist-packages/nunki-documentation.pdf || true
          cp -r nunki/doc/site dist-packages/docs-nunki/site || true
          cp quasar/doc/documentation.pdf dist-packages/quasar-documentation.pdf || true
          cp -r quasar/doc/site dist-packages/docs-quasar/site || true

      - name: Upload Linux Packages & Containerfiles
        uses: actions/upload-artifact@v3
        with:
          name: release-${{ matrix.os }}
          path: dist-packages/*

      - name: Save Quasar ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: quasar/.ccache
          key: ${{ matrix.os }}-quasar-ccache-${{ gitea.sha }}-${{ gitea.run_id }}-${{ gitea.run_attempt }}

      - name: "Retention: Prune Older Workflow Runs, Logs & Artifacts (Keep Last 3)"
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_CLEANUP_TOKEN || gitea.token }}
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPO: ${{ gitea.repository }}
          GITEA_RUN_ID: ${{ gitea.run_id }}
          KEEP_RUNS: "3"
        run: |
          if [ -z "${GITEA_TOKEN:-}" ] || ! command -v python3 >/dev/null 2>&1; then
            echo "Retention skipped: missing GITEA_TOKEN or python3."
            exit 0
          fi
          python3 - <<'PY'
          import collections, json, os, urllib.error, urllib.request

          token = os.environ.get("GITEA_TOKEN", "").strip()
          api = os.environ.get("GITEA_API_URL", "").rstrip("/")
          repo = os.environ.get("GITEA_REPO", "").strip("/")
          cur_id = str(os.environ.get("GITEA_RUN_ID", "")).strip()
          keep = int(os.environ.get("KEEP_RUNS", "3"))
          if not (token and api and repo):
              print("Retention skipped: missing API context.")
              raise SystemExit(0)

          def req(method, path):
              url = f"{api}/repos/{repo}{path}"
              r = urllib.request.Request(
                  url, method=method, headers={"Authorization": f"token {token}"}
              )
              try:
                  with urllib.request.urlopen(r, timeout=15) as resp:
                      body = resp.read().decode("utf-8", errors="replace")
                      return resp.status, (json.loads(body) if body.strip() else {})
              except urllib.error.HTTPError as exc:
                  err = exc.read().decode("utf-8", errors="replace")
                  return exc.code, {"error": err[:200]}
              except Exception as exc:
                  return 0, {"error": str(exc)}

          all_runs = []
          for page in range(1, 21):
              st, data = req("GET", f"/actions/runs?page={page}&limit=50")
              if st != 200:
                  print(f"GET runs page={page} -> HTTP {st}: {data}")
                  break
              batch = (data.get("workflow_runs") or []) if isinstance(data, dict) else []
              if not batch:
                  break
              all_runs.extend(batch)
              if len(batch) < 50:
                  break

          by_wf = collections.defaultdict(list)
          for run in all_runs:
              wf = (run.get("path") or "__unknown__").split("@", 1)[0]
              by_wf[wf].append(run)

          active_states = {"in_progress", "running", "queued", "waiting", "pending"}
          pruned_ids = set()
          for wf, runs in sorted(by_wf.items()):
              runs.sort(key=lambda r: int(r.get("id") or 0), reverse=True)
              for run in runs[keep:]:
                  rid = str(run.get("id") or "")
                  status = str(run.get("status") or "").lower()
                  if not rid or rid == cur_id or status in active_states:
                      continue
                  pruned_ids.add(rid)
                  st_a, arts = req("GET", f"/actions/runs/{rid}/artifacts")
                  if st_a == 200 and isinstance(arts, dict):
                      for art in (arts.get("artifacts") or []):
                          aid = art.get("id")
                          if aid is not None:
                              da, _ = req("DELETE", f"/actions/artifacts/{aid}")
                              print(f"[{wf}] DEL artifact id={aid} -> HTTP {da}")
                  dr, _ = req("DELETE", f"/actions/runs/{rid}")
                  print(f"[{wf}] DEL run id={rid} (logs+run) -> HTTP {dr}")
                  if dr == 403:
                      print("Hint: set GITEA_CLEANUP_TOKEN secret if token lacks delete")

          st_all, repo_arts = req("GET", "/actions/artifacts?limit=100")
          if st_all == 200 and isinstance(repo_arts, dict):
              for art in (repo_arts.get("artifacts") or []):
                  wrid = str((art.get("workflow_run") or {}).get("id") or "")
                  if wrid in pruned_ids or art.get("expired"):
                      aid = art.get("id")
                      if aid is not None:
                          da, _ = req("DELETE", f"/actions/artifacts/{aid}")
                          print(f"[orphan/expired] DEL artifact {aid} -> HTTP {da}")
          print(f"Retention check finished (keep={keep}, runs_scanned={len(all_runs)})")
          PY

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          free -h || true
          df -h . || true
          du -sh quasar/.ccache quasar/build-projects dist-packages 2>/dev/null || true
          ls -la
