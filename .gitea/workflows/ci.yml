name: Gitea CI Pipeline

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Nunki
    runs-on: ubuntu-latest
    if: startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')

    steps:
      - name: "Diagnostic: Environment & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          echo "=== Host / Container OS ==="
          cat /etc/os-release 2>/dev/null || true
          uname -a
          id
          pwd
          df -h . || true
          echo "=== Runner Context ==="
          printf '%s\n' "$CTX_RUNNER"
          echo "=== Strategy / Matrix Context ==="
          printf '%s\n' "$CTX_STRATEGY"
          printf '%s\n' "$CTX_MATRIX"
          echo "=== Gitea Context (token redacted) ==="
          printf '%s\n' "$CTX_GITEA" | sed 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: "Diagnostic: Workspace & Toolchain Check"
        run: |
          echo "=== Workspace Files ==="
          ls -la
          if [ -d .git ]; then
            git status -sb || true
            git remote -v || true
            git log -1 --oneline || true
          fi
          echo "=== Available Tools ==="
          for cmd in node git python3 cmake gcc g++ make java mvn podman docker curl; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf "%-10s %s\n" "$cmd:" "$(command -v "$cmd")"
            else
              printf "%-10s missing\n" "$cmd:"
            fi
          done

      - name: Install Maven
        run: |
          SUDO=""
          [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends maven

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/main/frontend/package-lock.json'

      - name: Build and Package with Maven
        run: mvn clean package -DskipTests

      - name: Run Unit Tests
        run: mvn test

      - name: Upload Uber Jar Artifact
        uses: actions/upload-artifact@v3
        with:
          name: nunki-jar
          path: target/nunki-0.0.1-SNAPSHOT.jar

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          df -h . || true
          ls -la

  integration-test:
    name: Quasar & Nunki Integration Test
    runs-on: ubuntu-latest
    if: startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')
    needs: build-and-test

    steps:
      - name: "Diagnostic: Environment & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          echo "=== Host / Container OS ==="
          cat /etc/os-release 2>/dev/null || true
          uname -a
          id
          pwd
          df -h . || true
          echo "=== Runner Context ==="
          printf '%s\n' "$CTX_RUNNER"
          echo "=== Strategy / Matrix Context ==="
          printf '%s\n' "$CTX_STRATEGY"
          printf '%s\n' "$CTX_MATRIX"
          echo "=== Gitea Context (token redacted) ==="
          printf '%s\n' "$CTX_GITEA" | sed 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'

      - name: Checkout Nunki
        uses: actions/checkout@v4
        with:
          path: nunki

      - name: Checkout Quasar
        uses: actions/checkout@v4
        with:
          repository: m/quasar
          path: quasar
          submodules: recursive
          token: ${{ gitea.token }}

      - name: "Diagnostic: Workspace & Toolchain Check"
        run: |
          echo "=== Workspace Files ==="
          ls -la
          if [ -d .git ]; then
            git status -sb || true
            git remote -v || true
            git log -1 --oneline || true
          fi
          echo "=== Available Tools ==="
          for cmd in node git python3 cmake gcc g++ make java mvn podman docker curl; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf "%-10s %s\n" "$cmd:" "$(command -v "$cmd")"
            else
              printf "%-10s missing\n" "$cmd:"
            fi
          done

      - name: Prepare Quasar Build Context
        run: |
          mkdir -p quasar/quasar_server
          cp -r nunki/quasar_server/* quasar/quasar_server/

      - name: Build & Verify Container Stack
        run: |
          COMPOSE_CMD="docker compose"
          command -v docker >/dev/null || COMPOSE_CMD="podman compose"
          $COMPOSE_CMD -f nunki/helpers/docker-compose.yml build
          $COMPOSE_CMD -f nunki/helpers/docker-compose.yml up -d
          sleep 15
          $COMPOSE_CMD -f nunki/helpers/docker-compose.yml ps
          $COMPOSE_CMD -f nunki/helpers/docker-compose.yml logs quasar
          $COMPOSE_CMD -f nunki/helpers/docker-compose.yml logs nunki

      - name: Stop Container Stack
        if: always()
        run: |
          COMPOSE_CMD="docker compose"
          command -v docker >/dev/null || COMPOSE_CMD="podman compose"
          $COMPOSE_CMD -f nunki/helpers/docker-compose.yml down

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          df -h . || true
          ls -la

  build-docs:
    name: Build & Upload Documentation
    runs-on: ubuntu-latest
    if: startsWith(gitea.server_url, 'https://gitea2.lecabellec.fr')

    steps:
      - name: "Diagnostic: Environment & Runner Context"
        env:
          CTX_RUNNER: ${{ toJSON(runner) }}
          CTX_STRATEGY: ${{ toJSON(strategy) }}
          CTX_MATRIX: ${{ toJSON(matrix) }}
          CTX_GITEA: ${{ toJSON(gitea) }}
        run: |
          echo "=== Host / Container OS ==="
          cat /etc/os-release 2>/dev/null || true
          uname -a
          id
          pwd
          df -h . || true
          echo "=== Runner Context ==="
          printf '%s\n' "$CTX_RUNNER"
          echo "=== Strategy / Matrix Context ==="
          printf '%s\n' "$CTX_STRATEGY"
          printf '%s\n' "$CTX_MATRIX"
          echo "=== Gitea Context (token redacted) ==="
          printf '%s\n' "$CTX_GITEA" | sed 's/"token":[[:space:]]*"[^"]*"/"token": "***"/g'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout MkDocs Kit
        run: |
          rm -rf mkdocs-kit
          git clone --depth=1 https://github.com/mlecabellec/mkdocs-kit.git mkdocs-kit

      - name: "Diagnostic: Workspace & Toolchain Check"
        run: |
          echo "=== Workspace Files ==="
          ls -la
          if [ -d .git ]; then
            git status -sb || true
            git remote -v || true
            git log -1 --oneline || true
          fi
          echo "=== Available Tools ==="
          for cmd in node git python3 cmake gcc g++ make java mvn podman docker curl; do
            if command -v "$cmd" >/dev/null 2>&1; then
              printf "%-10s %s\n" "$cmd:" "$(command -v "$cmd")"
            else
              printf "%-10s missing\n" "$cmd:"
            fi
          done

      - name: Set up Java (required for PlantUML)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (PlantUML, Pango, Cairo)
        run: |
          SUDO=""
          [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null && SUDO="sudo"
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends plantuml graphviz libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libjpeg-dev libopenjp2-7-dev libffi-dev libxml2-dev libxslt1-dev

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install "setuptools<82.0.0"
          pip install ./mkdocs-kit

      - name: Build Documentation
        run: |
          cd doc
          mkdocs-kit build

      - name: Upload Documentation Site Artifact
        uses: actions/upload-artifact@v3
        with:
          name: nunki-docs-site
          path: doc/site/

      - name: Upload PDF Manual Artifact
        uses: actions/upload-artifact@v3
        with:
          name: nunki-docs-pdf
          path: doc/documentation.pdf

      - name: "Diagnostic: Post-Run Summary"
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          df -h . || true
          ls -la
